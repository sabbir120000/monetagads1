<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Bot - Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script><!-- Ad SDK -->
    <script src="https://lovely-glow-forge.lovable.app/api/public/sdk.js?k=5dcbd7f4e55a4d175a07692a" data-sdk="5dcbd7f4e55a4d175a07692a"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 50%, #fdf2f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            padding: 30px;
        }

        .island {
            background: #ffffff;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
            transition: all 0.5s ease;
            min-width: 180px;
            margin: 0 auto 2rem;
        }

        .island.active {
            width: 100%;
            border-radius: 20px;
        }

        .btn-3d {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 0 rgba(226, 232, 240, 1);
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(226, 232, 240, 1);
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(1);
        }

        .timer-container {
            position: relative;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-circle-svg {
            position: absolute;
            transform: rotate(-90deg);
            width: 45px;
            height: 45px;
        }

        circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e2e8f0;
        }

        .circle-progress {
            stroke: #4f46e5;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            transition: stroke-dashoffset 1s linear;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="glass-panel text-center"><!-- Status Island -->
        <div id="island" class="island">
            <div id="idleState" class="flex items-center gap-2"> <span id="statusText" class="text-xs font-bold text-slate-500 uppercase tracking-widest">System Ready</span></div>
            <div id="activeState" class="hidden w-full flex justify-between items-center text-left">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600"><br></div>
                    <div>
                        <h4 class="text-[10px] font-black text-indigo-500 uppercase">Auto Bot</h4>
                        <p class="text-xs font-bold text-slate-700">Next Ad in...</p>
                    </div>
                </div>
                <div class="timer-container"><svg class="timer-circle-svg" viewBox="0 0 36 36">&nbsp; &nbsp;</svg> <span id="timerText" class="text-[12px] font-black text-indigo-600 relative z-10">8</span></div>
            </div>
        </div>
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-1">AD ENGINE</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em]">Premium Automation</p>
        </div>
        <div class="flex flex-col gap-4"><!-- Manual Play -->
            <div id="manualBtn" onclick="manualAd()" class="btn-3d group">
                <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white"><br></div>
                <div class="text-left">
                    <h3 class="text-md font-extrabold">Manual Play</h3>
                    <p class="text-[11px] text-slate-400">Watch 1 Premium Ad</p>
                </div>
            </div>
            <div class="flex items-center gap-4 my-2">
                <div class="h-[1px] bg-slate-200 flex-1"><br></div><span class="text-[9px] font-bold text-slate-300">AUTO MODE</span>
                <div class="h-[1px] bg-slate-200 flex-1"><br></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div id="btnOn" onclick="enableAutoMode()" class="btn-3d flex-col py-6"> <span class="text-sm font-black text-emerald-600">START AUTO</span></div>
                <div id="btnOff" onclick="disableAutoMode()" class="btn-3d flex-col py-6 disabled"> <span class="text-sm font-black text-rose-500">STOP BOT</span></div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram?.WebApp;
        let timeLeft = 8;
        let countdownInterval = null;
        
        // মূল অ্যাড ফাংশন
        function triggerAd() {
            const userId = tg?.initDataUnsafe?.user?.id || "guest_" + Math.floor(Math.random() * 9999);
            
            // SDK রেডি হওয়া পর্যন্ত অপেক্ষা করবে
            let checkSDK = setInterval(() => {
                if (typeof showRewardedInterstitial_5dcbd7f4e55a4d175a07692a === "function") {
                    clearInterval(checkSDK);
                    
                    showRewardedInterstitial_5dcbd7f4e55a4d175a07692a({ ymid: userId })
                        .then(() => {
                            console.log("Ad show success");
                            document.getElementById("statusText").innerText = "Success! Loaded";
                        })
                        .catch(() => {
                            console.log("Ad failed");
                            document.getElementById("statusText").innerText = "Failed/No Ad";
                        });
                }
            }, 300);
        }
        
        // পেজ লোড হলে অটো মোড চেক
        window.addEventListener('load', function() {
            const isAutoOn = localStorage.getItem('bot_auto_active');
            if(isAutoOn === 'true') {
                setupAutoUI();
                triggerAd(); // প্রথম অ্যাড
                startCountdown(); // ৮ সেকেন্ডের কাউন্টডাউন
            }
        });
        
        // ফিক্সড ম্যানুয়াল অ্যাড ফাংশন
        function manualAd() {
            // ১. যদি অটো মোড চালু থাকে, তা বন্ধ করবে (রিলোড ছাড়াই)
            localStorage.setItem('bot_auto_active', 'false');
            if(countdownInterval) clearInterval(countdownInterval);
            
            // ২. UI আপডেট
            document.getElementById("statusText").innerText = "Requesting Ad...";
            
            // ৩. সরাসরি অ্যাড কল করবে
            triggerAd();
        }
        
        function enableAutoMode() {
            localStorage.setItem('bot_auto_active', 'true');
            location.reload();
        }
        
        function disableAutoMode() {
            localStorage.setItem('bot_auto_active', 'false');
            location.reload();
        }
        
        function setupAutoUI() {
            document.getElementById("btnOn").classList.add("disabled");
            document.getElementById("btnOff").classList.remove("disabled");
            document.getElementById("island").classList.add("active");
            document.getElementById("idleState").classList.add("hidden");
            document.getElementById("activeState").classList.remove("hidden");
        }
        
        function startCountdown() {
            const progressCircle = document.getElementById("progressCircle");
            const timerText = document.getElementById("timerText");
        
            countdownInterval = setInterval(() => {
                timeLeft--;
                if(timerText) timerText.innerText = timeLeft;
                
                let offset = (timeLeft / 8) * 100;
                if(progressCircle) progressCircle.style.strokeDashoffset = offset;
        
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    location.reload(); 
                }
            }, 1000);
        }
    </script>
</body>

</html>
