    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 50%, #fdf2f8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            padding: 30px;
        }

        .island {
            background: #ffffff;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
            transition: all 0.5s ease;
            min-width: 180px;
            margin: 0 auto 2rem;
        }

        .island.active {
            width: 100%;
            border-radius: 20px;
        }

        .btn-3d {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 0 rgba(226, 232, 240, 1);
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .btn-3d:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(226, 232, 240, 1);
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(1);
        }

        .timer-container {
            position: relative;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-circle-svg {
            position: absolute;
            transform: rotate(-90deg);
            width: 45px;
            height: 45px;
        }

        path {
            fill: none;
            stroke-width: 3.5;
            stroke-linecap: round;
        }

        .circle-bg {
            stroke: #e2e8f0;
        }

        .circle-progress {
            stroke: #4f46e5;
            stroke-dasharray: 100;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }

        .hidden {
            display: none !important;
        }

<body>
    <div class="glass-panel text-center"><!-- Status Island -->
        <div id="island" class="island">
            <div id="idleState" class="flex items-center gap-2"><span id="statusText" class="text-xs font-bold text-slate-500 uppercase tracking-widest">System Ready</span></div>
            <div id="activeState" class="hidden w-full flex justify-between items-center text-left">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600"><br></div>
                    <div>
                        <h4 class="text-[10px] font-black text-indigo-500 uppercase">Auto Bot</h4>
                        <p class="text-xs font-bold text-slate-700">Next Ad in...</p>
                    </div>
                </div>
                <div class="timer-container"><svg class="timer-circle-svg" viewBox="0 0 36 36">&nbsp;<path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>
                        <path id="progressCircle" class="circle-progress" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"></path>&nbsp;
                    </svg> <span id="timerText" class="text-[12px] font-black text-indigo-600 relative z-10">8</span></div>
            </div>
        </div>
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold text-indigo-600 mb-1">AD Spark </h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.4em]">Premium Automation</p>
        </div>
        <div class="flex flex-col gap-4"><!-- Manual Play Button -->
            <div id="manualBtn" onclick="manualAd()" class="btn-3d group">
                <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white"><br></div>
                <div class="text-left">
                    <h3 class="text-md font-extrabold">Manual Play</h3>
                    <p class="text-[11px] text-slate-400">Watch 1 Premium Ad</p>
                </div>
            </div>
            <div class="flex items-center gap-4 my-2">
                <div class="h-[1px] bg-slate-200 flex-1"><br></div><span class="text-[9px] font-bold text-slate-300">AUTO MODE</span>
                <div class="h-[1px] bg-slate-200 flex-1"><br></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div id="btnOn" onclick="enableAutoMode()" class="btn-3d flex-col py-6"><span class="text-sm font-black text-emerald-600">START AUTO</span></div>
                <div id="btnOff" onclick="disableAutoMode()" class="btn-3d flex-col py-6 disabled"><span class="text-sm font-black text-rose-500">STOP BOT</span></div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();
        
        let timeLeft = 8;
        let countdownInterval = null;
        
        // টেলিগ্রাম আইডি পাওয়ার ফাংশন
        function getUserId() {
            return tg?.initDataUnsafe?.user?.id || "guest_" + Math.floor(Math.random() * 9999);
        }
        
        // ম্যানুয়াল প্লে (ক্লিক করার ১ সেকেন্ডের মধ্যে ইনস্ট্যান্ট অ্যাড শো করবে)
        function manualAd() {
            // ১. অটো মোড বন্ধ করা
            localStorage.setItem('bot_auto_active', 'false');
            if(countdownInterval) clearInterval(countdownInterval);
            
            const statusElem = document.getElementById("statusText");
            if (statusElem) statusElem.innerText = "Opening Ad...";
        
            const userId = getUserId();
        
            // ২. সরাসরি ইনস্ট্যান্ট অ্যাড কল (কোনো বিলম্ব ছাড়া)
            if (typeof showAdspark === "function") {
                showAdspark({ ymid: userId })
                    .then(() => {
                        console.log("Manual Ad completed");
                        if (statusElem) statusElem.innerText = "Ad Success!";
                    })
                    .catch((err) => {
                        console.log("No ad available / Error", err);
                        if (statusElem) statusElem.innerText = "No Ad Available";
                    });
            } else {
                console.log("SDK not ready yet");
                if (statusElem) statusElem.innerText = "SDK Loading...";
            }
        }
        
        // অটো মোডের জন্য অ্যাড কল
        function triggerAutoAd() {
            const userId = getUserId();
            let checkSDK = setInterval(() => {
                if (typeof showAdspark === "function") {
                    clearInterval(checkSDK);
                    showAdspark({ ymid: userId })
                        .then(() => {
                            const statusElem = document.getElementById("statusText");
                            if (statusElem) statusElem.innerText = "Ad Success!";
                        })
                        .catch((err) => {
                            const statusElem = document.getElementById("statusText");
                            if (statusElem) statusElem.innerText = "No Ad Available";
                        });
                }
            }, 300);
        }
        
        // পেজ লোড হলে অটো মোড রান হবে
        window.addEventListener('load', function() {
            const isAutoOn = localStorage.getItem('bot_auto_active');
            if(isAutoOn === 'true') {
                setupAutoUI();
                triggerAutoAd();
                startCountdown();
            }
        });
        
        function enableAutoMode() {
            localStorage.setItem('bot_auto_active', 'true');
            location.reload();
        }
        
        function disableAutoMode() {
            localStorage.setItem('bot_auto_active', 'false');
            location.reload();
        }
        
        function setupAutoUI() {
            document.getElementById("btnOn").classList.add("disabled");
            document.getElementById("btnOff").classList.remove("disabled");
            document.getElementById("island").classList.add("active");
            document.getElementById("idleState").classList.add("hidden");
            document.getElementById("activeState").classList.remove("hidden");
        }
        
        function startCountdown() {
            const progressCircle = document.getElementById("progressCircle");
            const timerText = document.getElementById("timerText");
        
            countdownInterval = setInterval(() => {
                timeLeft--;
                if(timerText) timerText.innerText = timeLeft;
                
                let offset = (timeLeft / 8) * 100;
                if(progressCircle) progressCircle.style.strokeDashoffset = (100 - offset);
        
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    location.reload();
                }
            }, 1000);
        }
    </script>
</body>
